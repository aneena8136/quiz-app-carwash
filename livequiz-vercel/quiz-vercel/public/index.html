<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d3f1b8">
  <title>Join the Quiz</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="player">
  <header class="appbar">
    <div class="logo"><span class="mark">Q</span>LiveQuiz</div>
    <span class="pill hidden" id="hdr-score">0 pts</span>
  </header>

  <main class="wrap">
    <!-- Join -->
    <section id="v-join" class="card join">
      <h1>Join a quiz</h1>
      <p class="muted">Enter the PIN on the host’s screen.</p>
      <form id="join-form" autocomplete="off">
        <label for="pin">Game PIN</label>
        <input id="pin" class="pin-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="1234" required>
        <label for="name">Your name</label>
        <input id="name" type="text" maxlength="20" placeholder="e.g. Priya" required>
        <button class="btn block big" type="submit" id="join-btn">Join quiz</button>
        <div class="error" id="join-error" role="alert"></div>
      </form>
    </section>

    <!-- Lobby -->
    <section id="v-lobby" class="card center hidden">
      <div class="live-dot" aria-hidden="true"></div>
      <h2>You’re in, <span id="lobby-name"></span></h2>
      <p class="muted" id="lobby-title"></p>
      <p class="chip-soft" id="lobby-count"></p>
      <p class="muted small">Waiting for the host to start…</p>
    </section>

    <!-- Question -->
    <section id="v-question" class="hidden">
      <div class="q-head">
        <span class="pill soft" id="q-count"></span>
        <span class="timer" id="q-timer"></span>
      </div>
      <div class="timebar"><span id="q-bar"></span></div>
      <h2 class="q-text" id="q-text"></h2>
      <figure class="q-media hidden" id="q-media"><img id="q-image" alt="Question image"></figure>
      <div class="options" id="q-options"></div>
      <p class="waiting hidden" id="q-wait"><span class="spinner" aria-hidden="true"></span><span id="q-wait-text">Answer locked in. Waiting for others…</span></p>
    </section>

    <!-- Result -->
    <section id="v-reveal" class="card center result hidden">
      <div class="result-icon" id="r-icon"></div>
      <h2 id="r-title"></h2>
      <p class="muted small">Correct answer</p>
      <p class="answer" id="r-answer"></p>
      <div class="points" id="r-points"></div>
      <div class="stats single">
        <div><span class="stat-label">Your total score</span><span class="stat-value" id="r-score"></span></div>
      </div>
      <p class="muted small">Next question coming up…</p>
    </section>

    <!-- Final -->
    <section id="v-ended" class="card center hidden">
      <p class="eyebrow">Final result</p>
      <div class="rank-big" id="f-rank"></div>
      <p class="muted" id="f-of"></p>
      <p class="score-line"><b id="f-score"></b> points</p>
      <div class="board compact" id="f-top"></div>
      <button class="btn block secondary" id="again-btn">Join another quiz</button>
    </section>

    <p class="toast hidden" id="conn"><span class="spinner" aria-hidden="true"></span>Reconnecting…</p>
  </main>
  <script src="/socket.io.min.js"></script>
  <script src="/player.js"></script>
</body>
</html>
