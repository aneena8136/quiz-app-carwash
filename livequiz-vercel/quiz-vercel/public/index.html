<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Join the Quiz</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="wrap">
    <div class="brand">Live<span>Quiz</span></div>

    <!-- Join -->
    <section id="v-join" class="card">
      <form id="join-form" autocomplete="off">
        <label for="pin">Game PIN</label>
        <input id="pin" class="pin-input" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000" required>
        <label for="name">Your name</label>
        <input id="name" type="text" maxlength="20" placeholder="e.g. Priya" required>
        <button class="btn block big" type="submit" id="join-btn">Join</button>
        <div class="error" id="join-error" role="alert"></div>
      </form>
    </section>

    <!-- Lobby -->
    <section id="v-lobby" class="card center hidden">
      <div class="big-emoji">🎉</div>
      <h2>You're in, <span id="lobby-name"></span>!</h2>
      <p class="muted" id="lobby-title"></p>
      <p class="pulse">Waiting for the quiz master to start…</p>
    </section>

    <!-- Question -->
    <section id="v-question" class="hidden">
      <div class="q-meta"><span id="q-count"></span><span class="timer" id="q-timer"></span></div>
      <div class="q-text" id="q-text"></div>
      <img class="q-image hidden" id="q-image" alt="Question image">
      <div class="options" id="q-options"></div>
      <p class="center light pulse hidden" id="q-wait">Answer locked in. Waiting for the others…</p>
    </section>

    <!-- Result -->
    <section id="v-reveal" class="card center hidden">
      <div class="big-emoji" id="r-emoji"></div>
      <h2 id="r-title"></h2>
      <p class="muted" id="r-answer"></p>
      <div class="stat" id="r-points"></div>
      <p>Total score: <b id="r-score"></b> · Rank <b id="r-rank"></b></p>
      <p class="muted pulse">Next question coming up…</p>
    </section>

    <!-- Final -->
    <section id="v-ended" class="card center hidden">
      <div class="big-emoji">🏆</div>
      <h2>Quiz finished!</h2>
      <p>You placed <b id="f-rank"></b> with <b id="f-score"></b> points.</p>
      <div id="f-top"></div>
      <button class="btn block" id="again-btn">Join another quiz</button>
    </section>

    <p class="center light hidden" id="conn">Reconnecting…</p>
  </div>
  <script src="/socket.io.min.js"></script>
  <script src="/player.js"></script>
</body>
</html>
